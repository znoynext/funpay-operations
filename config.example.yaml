app:
  environment: development
  log_level: INFO
  data_directory: data

storage:
  database_file: funpay.sqlite3
  logs_directory: logs
  backups_directory: backups

operations:
  # Real actions are off by default. Enabling them will require a later,
  # explicit implementation and configuration review.
  enabled: false
  mode: safe
  poll_interval_seconds: 30
  reconnect_initial_seconds: 5
  reconnect_max_seconds: 60

funpay:
  credential_key: funpay_session
  # No official seller API contract is configured here. Add only owner-verified
  # relative GET paths; values may use {seller_id}, {after_message_id}, {lot_id}.
  read_endpoints: {}
  request_timeout_seconds: 15
  min_request_interval_seconds: 1.0
  retry_attempts: 3

telegram:
  token_key: telegram_bot_token
  allowed_user_ids: []

lots:
  default_currency: RUB
  hard_floor: null
