[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "funpay-operations"
version = "0.1.0"
description = "Windows background application scaffold for controlled FunPay operations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2,<7",
  "python-dotenv>=1.0.1,<2",
]

[project.scripts]
funpay-operations = "funpay_operations.__main__:main"
funpay-setup = "funpay_operations.setup_wizard:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
