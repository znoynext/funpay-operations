[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "funpay-operations"
version = "0.1.0"
description = "FunPay Operations for World of Warcraft Mythic+."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fpx-engine==0.7.4",
  "PyYAML>=6.0.2,<7",
  "python-dotenv>=1.2.2,<2",
  "idna>=3.15,<4",
]

[project.optional-dependencies]
build = [
  "pyinstaller==6.22.0",
]

[project.scripts]
funpay-operations = "funpay_operations.__main__:main"
funpay-setup = "funpay_operations.setup_wizard:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
