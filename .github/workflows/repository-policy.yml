name: Repository policy

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify required proprietary notices
        shell: bash
        run: |
          test -f LICENSE
          test -f CODEOWNERS
          test -f .github/dependabot.yml
          grep -Fq 'All Rights Reserved' LICENSE
          grep -Fqi 'not open source' LICENSE
      - name: Reject sensitive artifacts and credentials
        shell: bash
        run: |
          while IFS= read -r path; do
            case "$path" in
              .env|.env.*|*/.env|*/.env.*)
                if [[ "$path" != ".env.example" && "$path" != */.env.example ]]; then
                  echo "Sensitive environment file is tracked: $path"
                  exit 1
                fi
                ;;
              config.yaml|*/config.yaml|secrets/*|*/secrets/*|data/*|*/data/*|logs/*|*/logs/*|backups/*|*/backups/*|*.pem|*.key|*.pfx|*.p12|*.db|*.sqlite|*.sqlite3|*.bak|*.backup|*.log)
                echo "Sensitive artifact is tracked: $path"
                exit 1
                ;;
            esac
          done < <(git ls-files)

          secret_pattern="(gh[pous]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|[0-9]{8,10}:[A-Za-z0-9_-]{35}|(golden_key|golden_seal|telegram_bot_token)[[:space:]]*[:=][[:space:]]*['\"][A-Za-z0-9_%.-]{24,}['\"])"
          ! git grep -I -l -E "$secret_pattern" -- . ':!*.example*'
