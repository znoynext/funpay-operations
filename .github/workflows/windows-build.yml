name: Windows generic build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Standalone executables
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.0.0
        with:
          dotnet-version: "8.0.x"
      - name: Build generic executables
        shell: powershell
        run: .\scripts\build_windows.ps1
      - name: Smoke test all packaged installation paths without accounts
        shell: powershell
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'funpay-operations-localappdata'
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'funpay-operations-appdata'
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA, $env:APPDATA | Out-Null
          .\dist\funpay-operations-cli.exe diagnostics
          .\dist\funpay-operations-cli.exe --background --once
          .\dist\funpay-operations-cli.exe setup --non-interactive
          $app = Join-Path $env:LOCALAPPDATA 'FunPay Operations\app'
          'funpay-operations.exe', 'funpay-operations-cli.exe', 'funpay-operations-setup.exe', 'funpay-operations-auth.exe', 'THIRD_PARTY_NOTICES.md' | ForEach-Object {
            $path = Join-Path $app $_
            if (-not (Test-Path -LiteralPath $path) -or (Get-Item -LiteralPath $path).Length -le 0) { throw "Missing installed binary: $_" }
          }
          & (Join-Path $app 'funpay-operations-cli.exe') diagnostics
          & (Join-Path $app 'funpay-operations.exe') --background --once
          & (Join-Path $app 'funpay-operations-setup.exe') --smoke
          & (Join-Path $app 'funpay-operations-auth.exe') --runtime-status
          if ($LASTEXITCODE -notin @(0, 2)) { throw "WebView2 helper status check failed: $LASTEXITCODE" }
          & (Join-Path $app 'funpay-operations-cli.exe') uninstall
      - name: Upload generic executables only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: funpay-operations-generic-windows
          path: |
            dist/funpay-operations.exe
            dist/funpay-operations-cli.exe
            dist/funpay-operations-setup.exe
            dist/funpay-operations-auth.exe
            dist/THIRD_PARTY_NOTICES.md
